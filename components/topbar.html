<!-- STYLE KHUSUS FLOATING TOPBAR GLASSMORPHISM & ANIMASI DROPDOWN HALUS -->
<style>
    .dash-topbar-wrapper {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        width: 100%;
        max-width: 1320px;
        padding: 0 24px;
    }

    .dash-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        padding: 8px 20px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07),
            inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    }

    .dash-brand-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none !important;
    }

    .brand-logo-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: linear-gradient(135deg, #1b7a3e 0%, #28a745 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 18px;
        font-weight: 800;
        padding: 6px;
        overflow: hidden;
    }

    .brand-logo-img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
    }

    .brand-text h4 {
        font-size: 1.05rem;
        margin: 0;
        font-weight: 800;
        color: #111418;
    }

    .brand-text p {
        font-size: 11.5px;
        color: #64748b;
        margin: 0;
    }

    .center-pill-nav {
        background: #111418;
        border-radius: 30px;
        padding: 4px 6px;
        display: inline-flex;
        align-items: center;
        gap: 2px;
    }

    .center-pill-nav a {
        color: #94a3b8;
        font-size: 13.5px;
        font-weight: 700;
        text-decoration: none;
        padding: 7px 15px;
        border-radius: 20px;
        transition: all 0.2s ease;
    }

    .center-pill-nav a:hover {
        color: #ffffff;
    }

    .center-pill-nav a.active {
        background: linear-gradient(135deg, #1b7a3e 0%, #28a745 100%) !important;
        color: #ffffff !important;
        box-shadow: 0 4px 14px rgba(40, 167, 69, 0.4);
    }

    .topbar-utilities {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .util-icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: #ffffff;
        border: 1px solid #e2e8e4;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #475569;
        font-size: 18px;
        text-decoration: none !important;
        transition: all 0.2s;
        position: relative;
    }

    .util-icon-btn:hover {
        background: #f0f8f3;
        color: #1b7a3e;
    }

    .util-badge-dot {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        border: 2px solid #ffffff;
    }

    /* Kustomisasi Dropdown Profile & Animasi Halus */
    .profile-dropdown-wrap .dropdown-toggle::after {
        display: none !important;
    }

    .profile-avatar-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #ffffff;
        border: 1px solid #e2e8e4;
        border-radius: 24px;
        padding: 3px 12px 3px 3px;
        cursor: pointer;
        text-decoration: none !important;
        transition: all 0.2s ease;
    }

    .profile-avatar-btn:hover,
    .profile-dropdown-wrap.show .profile-avatar-btn {
        border-color: #1b7a3e;
        box-shadow: 0 4px 12px rgba(27, 122, 62, 0.12);
    }

    .user-topbar-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
    }

    .user-info-name {
        font-size: 13px;
        font-weight: 700;
        color: #111418;
    }

    .user-info-role {
        font-size: 11px;
        color: #64748b;
    }

    .profile-chevron {
        font-size: 16px;
        color: #94a3b8;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .profile-dropdown-wrap.show .profile-chevron {
        transform: rotate(180deg);
        color: #1b7a3e;
    }

    /* Override Animasi Dropdown Bootstrap agar Smooth */
    .profile-dropdown-wrap .dropdown-menu {
        display: block;
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px) scale(0.98);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
    }

    .profile-dropdown-wrap.show .dropdown-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }

    .custom-profile-menu {
        border-radius: 18px !important;
        border: 1px solid #e2e8e4 !important;
        padding: 10px !important;
        min-width: 240px !important;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12) !important;
        margin-top: 10px !important;
    }

    .profile-menu-header {
        padding: 8px 12px 12px;
        border-bottom: 1px solid #f1f5f9;
        margin-bottom: 6px;
    }

    .profile-menu-header h6 {
        margin: 0;
        font-size: 13.5px;
        font-weight: 800;
        color: #111418;
    }

    .profile-menu-header p {
        margin: 2px 0 0;
        font-size: 11px;
        color: #64748b;
    }

    .custom-dropdown-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: 10px;
        color: #334155;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none !important;
        transition: all 0.15s ease;
    }

    .custom-dropdown-item i {
        font-size: 16px;
        color: #64748b;
        transition: color 0.15s;
    }

    .custom-dropdown-item:hover {
        background: #f0f8f3;
        color: #1b7a3e;
    }

    .custom-dropdown-item:hover i {
        color: #1b7a3e;
    }

    .custom-dropdown-item.danger-item {
        color: #dc2626;
    }

    .custom-dropdown-item.danger-item i {
        color: #dc2626;
    }

    .custom-dropdown-item.danger-item:hover {
        background: #fef2f2;
        color: #b91c1c;
    }

    .custom-dropdown-divider {
        height: 1px;
        background: #f1f5f9;
        margin: 6px 0;
    }

    @media (max-width: 768px) {
        .dash-topbar-wrapper {
            position: fixed;
            top: 16px;
            left: 0;
            right: 0;
            z-index: 1000;
            width: 100%;
            max-width: 1320px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .dash-topbar {
            padding: 10px 14px;
            flex-wrap: wrap;
        }

        .center-pill-nav {
            order: 3;
            width: 100%;
            overflow-x: auto;
            justify-content: flex-start;
            margin-top: 4px;
        }
    }
</style>
